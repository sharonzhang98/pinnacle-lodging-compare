  <style>
    :root {

      --accent: #0f766e;
      --best: #166534;
      --good: #1d4ed8;
      --ok: #57534e;
      --caution: #b45309;
      --clinic: #b91c1c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    header {
      padding: 18px 20px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--card);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    h1 { margin: 0 0 6px; font-size: 1.35rem; }
    .sub { margin: 0; color: var(--muted); font-size: 0.9rem; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
      align-items: center;
    }
    .toolbar button, .toolbar select {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 7px 12px;
      font: inherit;
      cursor: pointer;
    }
    .toolbar button.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .layout {
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 0;
      min-height: calc(100vh - 120px);
    }
    #map {
      height: calc(100vh - 120px);
      position: sticky;
      top: 120px;
      border-right: 1px solid var(--line);
    }
    .list {
      padding: 14px;
      overflow: auto;
      max-height: calc(100vh - 120px);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 12px;
      cursor: pointer;
      transition: border-color .15s, transform .15s;
    }
    .card:hover { border-color: #a8a29e; }
    .card.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(15,118,110,.18);
    }
    .card img.cover {
      width: 100%;
      height: 170px;
      object-fit: cover;
      display: block;
      background: #ddd;
    }
    .card-body { padding: 12px 14px 14px; }
    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 6px;
    }
    .pill {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--muted);
    }
    .pill.best { background: #dcfce7; color: var(--best); border-color: #bbf7d0; }
    .pill.good { background: #dbeafe; color: var(--good); border-color: #bfdbfe; }
    .pill.ok { background: #f5f5f4; color: var(--ok); }
    .pill.caution { background: #ffedd5; color: var(--caution); border-color: #fed7aa; }
    .pill.airbnb { background: #fff1f2; color: #9f1239; border-color: #fecdd3; }
    .pill.hotel { background: #f5f3ff; color: #5b21b6; border-color: #ddd6fe; }
    .name { font-weight: 700; font-size: 1rem; margin: 2px 0 4px; }
    .meta { color: var(--muted); font-size: 0.85rem; line-height: 1.45; }
    .thumbs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      padding: 0 14px 12px;
    }
    .thumbs img {
      width: 100%;
      height: 64px;
      object-fit: cover;
      border-radius: 8px;
      background: #e7e5e4;
    }
    .actions { display: flex; gap: 8px; margin-top: 8px; }
    .actions a {
      font-size: 0.85rem;
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    .legend {
      margin-left: auto;
      color: var(--muted);
      font-size: 0.8rem;
    }
    .leaflet-tooltip.place-tip {
      background: #111;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 12px;
    }
    @media (max-width: 960px) {
      .layout { grid-template-columns: 1fr; }
      #map { height: 42vh; position: relative; top: 0; border-right: none; border-bottom: 1px solid var(--line); }
      .list { max-height: none; }
    }
  </style>
</head>

    const clinicIcon = L.divIcon({
      className: "",
      html: `<div style="width:16px;height:16px;border-radius:50%;background:#b91c1c;border:2px solid #fff;box-shadow:0 0 0 2px #b91c1c88"></div>`,
      iconSize: [16, 16],
      iconAnchor: [8, 8]
    });
    L.marker([CLINIC.lat, CLINIC.lng], { icon: clinicIcon })
      .addTo(map)
      .bindTooltip(CLINIC.name, { permanent: false, className: "place-tip" });

    function colorFor(o) {
      if (o.kind === "hotel") return "#7c3aed";
      if (o.fit === "best") return "#16a34a";
      if (o.fit === "good") return "#2563eb";
      if (o.fit === "caution") return "#d97706";
      return "#57534e";
    }

    function makeIcon(o, selected) {
      const c = colorFor(o);
      const size = selected ? 18 : 14;
      return L.divIcon({
        className: "",
        html: `<div style="width:${size}px;height:${size}px;border-radius:50%;background:${c};border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.25)"></div>`,
        iconSize: [size, size],
        iconAnchor: [size / 2, size / 2]
      });
    }

    function passes(o) {
      if (filter === "airbnb") return o.kind === "airbnb";
      if (filter === "hotel") return o.kind === "hotel";
      if (filter === "free") return o.parking === "free_on_site";
      if (filter === "best") return o.fit === "best" || o.fit === "good";
      return true;
    }

    function select(id, pan = true) {
      selectedId = id;
      const o = OPTIONS.find((x) => x.id === id);
      renderList();
      Object.entries(markers).forEach(([mid, m]) => {
        const opt = OPTIONS.find((x) => x.id === mid);
        if (opt) m.setIcon(makeIcon(opt, mid === id));
      });
      if (o && pan) map.flyTo([o.lat, o.lng], 13, { duration: 0.6 });
    }

    function renderMarkers() {
      Object.values(markers).forEach((m) => map.removeLayer(m));
      Object.keys(markers).forEach((k) => delete markers[k]);
      OPTIONS.filter(passes).forEach((o) => {
        const m = L.marker([o.lat, o.lng], { icon: makeIcon(o, o.id === selectedId) })
          .addTo(map)
          .bindTooltip(o.name, { className: "place-tip" });
        m.on("click", () => select(o.id, false));
        markers[o.id] = m;
      });
    }

    function renderList() {
      const list = document.getElementById("list");
      const items = OPTIONS.filter(passes);
      list.innerHTML = items.map((o) => {
        const photos = (o.photos || []).slice(0, 3);
        const cover = photos[0] || "";
        return `
          <article class="card ${o.id === selectedId ? "selected" : ""}" data-id="${o.id}">
            <img class="cover" src="${cover}" alt="${o.name}" loading="lazy" onerror="this.style.background='#d6d3d1';this.removeAttribute('src')" />
            <div class="card-body">
              <div class="row">
                <span class="pill ${o.kind}">${o.kind === "airbnb" ? "Airbnb" : "酒店"}</span>
                <span class="pill ${o.fit}">${fitLabel[o.fit]}</span>
                <span class="pill">${parkingLabel[o.parking]}</span>
              </div>
              <div class="name">${o.name}</div>
              <div class="meta">
                ${o.area} · 去诊所 ${o.driveMin}<br/>
                ${o.price}<br/>
                ${o.rating}<br/>
                停车：${o.parkingNote}
              </div>
              <div class="actions">
                <a href="${o.url}" target="_blank" rel="noopener">打开详情</a>
                <a href="#" data-focus="${o.id}">在地图定位</a>
              </div>
            </div>
            <div class="thumbs">
              ${photos.map((p) => `<img src="${p}" alt="" loading="lazy" onerror="this.style.opacity=.3" />`).join("")}
            </div>
          </article>`;
      }).join("");

      list.querySelectorAll(".card").forEach((el) => {
        el.addEventListener("click", (e) => {
          if (e.target.closest("a[href^='http']")) return;
          e.preventDefault();
          select(el.dataset.id, true);
        });
      });
      list.querySelectorAll("[data-focus]").forEach((a) => {
        a.addEventListener("click", (e) => {
          e.preventDefault();
          e.stopPropagation();
          select(a.getAttribute("data-focus"), true);
        });
      });
    }

    document.querySelectorAll(".toolbar button[data-filter]").forEach((btn) => {
      btn.addEventListener("click", () => {
        filter = btn.dataset.filter;
        document.querySelectorAll(".toolbar button[data-filter]").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        renderMarkers();
        renderList();
      });
    });

    renderMarkers();
    renderList();
  </script>
</body>
</html>
